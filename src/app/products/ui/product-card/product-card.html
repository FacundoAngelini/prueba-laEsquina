@let product = this.product();

<article>
  <span class="category">{{ product.category }}</span>
  <h3>{{ product.name }}</h3>
  <p class="description">{{ product.description }}</p>
  <p class="price">$ {{ product.price }}</p>

  <div class="buttons">
    <a class="btn-details" [routerLink]="['/productos', product.id]">Ver detalles</a>
    <button type="button" class="btn-delete" (click)="productDeleted.emit(product.id)">Borrar</button>
  </div>
</article>
