<div class="header">
  <div class="Logo">
    <img src="images.jpg" alt="Creador del aura">
    <span class="logo-text">La esquina</span>
  </div>

  <div>
    <nav>
      <ul>
        <li><a routerLink="/inicio" routerLinkActive="active-link">Inicio</a></li>
        <li>
          <a routerLink="/productos" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Productos</a>
        </li>
        <li><a routerLink="/inicio" fragment="contacto">Contacto</a></li>
      </ul>
    </nav>
  </div>

  <button class="btn-login" (click)="openLogin()">Iniciar Sesion</button>

  @if (isLoginModelOpen()) {
    <app-login-modal (userConfirmed)="handleLoginClose($event)" />
  }
</div>
